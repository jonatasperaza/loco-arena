# loco-arena — docker compose
#
#   docker compose up --build                     # demo mode, zero GPUs
#   docker compose --profile gpu up --build       # + two vLLM servers (set ARENA_MODE=live, see README)
#   docker compose --profile ollama up --build    # + Ollama server  (set ARENA_MODE=live, see README)
#
# Values come from `.env` (copy .env.example). Defaults below mirror CONTRACT.md.

name: loco-arena

x-vllm-common: &vllm-common
  image: vllm/vllm-openai:latest
  profiles: ["gpu"]
  restart: unless-stopped
  ipc: host
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
  volumes:
    - hf-cache:/root/.cache/huggingface
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
    interval: 30s
    timeout: 10s
    retries: 10
    start_period: 600s

services:
  backend:
    build: ./backend
    image: loco-arena-backend:latest
    restart: unless-stopped
    environment:
      ARENA_MODE: ${ARENA_MODE:-demo}
      BASELINE_BASE_URL: ${BASELINE_BASE_URL:-http://localhost:8001/v1}
      BASELINE_MODEL: ${BASELINE_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Qwen-7B}
      BASELINE_API_KEY: ${BASELINE_API_KEY:-EMPTY}
      LOCO_BASE_URL: ${LOCO_BASE_URL:-http://localhost:8002/v1}
      LOCO_MODEL: ${LOCO_MODEL:-MuyaoYuan/LoCo-7B}
      LOCO_API_KEY: ${LOCO_API_KEY:-EMPTY}
      MAX_TOKENS: ${MAX_TOKENS:-8192}
      TEMPERATURE: ${TEMPERATURE:-0.6}
      TOP_P: ${TOP_P:-0.95}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-600}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PRESETS_PATH: ${PRESETS_PATH:-presets.json}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    image: loco-arena-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------- profile: gpu
  # Two OpenAI-compatible vLLM servers. Inside the compose network they listen on
  # port 8000, so set in .env:
  #   ARENA_MODE=live
  #   BASELINE_BASE_URL=http://vllm-baseline:8000/v1
  #   LOCO_BASE_URL=http://vllm-loco:8000/v1
  # Memory: a 7B model in bf16 needs ~15 GB of weights. Both on one GPU requires
  # ~40 GB+ (VLLM_GPU_UTIL=0.45 each). On a single 24 GB card use AWQ/GPTQ
  # checkpoints and a lower VLLM_MAX_MODEL_LEN, or put each server on its own GPU
  # with BASELINE_GPU=0 / LOCO_GPU=1.
  vllm-baseline:
    <<: *vllm-common
    command:
      - --model
      - ${BASELINE_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Qwen-7B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - ${VLLM_GPU_UTIL:-0.45}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BASELINE_GPU:-0}"]
              capabilities: [gpu]

  vllm-loco:
    <<: *vllm-common
    command:
      - --model
      - ${LOCO_MODEL:-MuyaoYuan/LoCo-7B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - ${VLLM_GPU_UTIL:-0.45}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-16384}
    ports:
      - "8002:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LOCO_GPU:-0}"]
              capabilities: [gpu]

  # ------------------------------------------------------------- profile: ollama
  # One Ollama server hosts both models (e.g. `r1-baseline` and `loco`). Set:
  #   ARENA_MODE=live
  #   BASELINE_BASE_URL=http://ollama:11434/v1   BASELINE_MODEL=r1-baseline
  #   LOCO_BASE_URL=http://ollama:11434/v1       LOCO_MODEL=loco
  # The GPU reservation below is used when an NVIDIA runtime is present. On
  # CPU-only hosts, comment out the `deploy:` block (Ollama falls back to CPU).
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "2"
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./ollama:/modelfiles:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
  ollama-data:
